name: 데이터 갱신 & 배포

on:
  schedule:
    # 23:10 UTC 월~금 = 한국 시간 화~토 08:10 (미국 장 마감 후)
    - cron: "10 23 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write
  pages: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 테스트
        run: |
          python -m unittest discover -s tests -v
          node --test tests/rebalance.test.js

      - name: 데이터 수집·계산
        run: python scripts/fetch_data.py

      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(python -c 'import json;print(json.load(open("data/latest.json")).get("data_date","update"))')"
            git push
          fi

      - name: gh-pages 브랜치로 배포
        run: |
          rm -rf _site && mkdir -p _site
          cp -r index.html app.js rebalance.js data _site/
          touch _site/.nojekyll
          cd _site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "deploy $(date -u +%F)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Pages 빌드 요청
        # GITHUB_TOKEN으로 한 push는 Pages 빌드를 자동으로 시작하지 않으므로 직접 요청
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
