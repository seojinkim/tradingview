name: 데이터 갱신 & 배포

on:
  schedule:
    # 23:10 UTC 월~금 = 한국 시간 화~토 08:10 (미국 장 마감 후)
    - cron: "10 23 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 테스트
        run: |
          python -m unittest discover -s tests -v
          node --test tests/rebalance.test.js

      - name: 데이터 수집·계산
        run: python scripts/fetch_data.py

      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(python -c 'import json;print(json.load(open("data/latest.json")).get("data_date","update"))')"
            git push
          fi

      - name: 사이트 파일 모으기
        run: |
          mkdir -p _site
          cp index.html app.js rebalance.js _site/
          cp -r data _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
